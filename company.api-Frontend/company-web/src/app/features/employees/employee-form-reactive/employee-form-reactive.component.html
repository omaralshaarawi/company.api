<!-- employee-form-reactive.component.html -->
<form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
        <label for="fullName" i18n>Full name</label>
        <input id="fullName" formControlName="fullName" />
        @if (form.get('fullName')?.invalid && form.get('fullName')?.touched) {
        <div class="error" i18n>Full name is required (max 150 characters).</div>
        }
    </div>
    <div class="form-group">
        <label for="email" i18n>Email</label>
        <input id="email" formControlName="email" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <div class="error" i18n>Enter a valid email address.</div>
        }
    </div>
    <div class="form-group">
        <label for="status" i18n>Status</label>
        <select id="status" formControlName="status">
            <option value="Active" i18n>Active</option>
            <option value="Suspended" i18n>Suspended</option>
            <option value="Terminated" i18n>Terminated</option>
        </select>
    </div>
    <button type="submit" i18n>Save</button>
</form>
