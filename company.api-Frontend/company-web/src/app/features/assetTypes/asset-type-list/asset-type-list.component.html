<div class="page-header">
    <div><span class="eyebrow">Inventory</span><h2>Asset types</h2></div>
    <a class="add-link" [routerLink]="['/asset-types','new']">Add asset type <span>↗</span></a>
</div>
@if (loading()) {
<p>Loading...</p>
} @else if (error()) {
<p class="error">{{ error() }}</p>
} @else {
<table>
    <thead>
        <tr>
            <th>Asset Type name</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (assetType of assetTypes(); track assetType.assetTypeId) {
        <tr>
            <td>{{ assetType.typeName }}</td>
            <td>
                <a [routerLink]="['/asset-types', assetType.assetTypeId, 'edit']">Edit</a>
                <button (click)="delete(assetType.assetTypeId)">Delete</button>
                
            </td>
        </tr>
        }
    </tbody>
</table>
}
