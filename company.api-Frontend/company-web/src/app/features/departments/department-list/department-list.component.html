<div class="page-header">
    <div><span class="eyebrow">Organization</span><h2>Departments</h2></div>
    <a class="add-link" [routerLink]="['/departments','new']">Add department <span>↗</span></a>
</div>
@if (loading()) {
<p>Loading...</p>
} @else if (error()) {
<p class="error">{{ error() }}</p>
} @else {
<table>
    <thead>
        <tr>
            <th>Department</th>
            <th>Created</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (dept of departments(); track dept.departmentId) {
        <tr>
            <td>{{ dept.name }}</td>
            <td>{{ dept.createdAt | date }}</td>
            <td>
                <a [routerLink]="['/departments', dept.departmentId, 'edit']">Edit</a>
                <button (click)="delete(dept.departmentId)">Delete</button>
                
            </td>
        </tr>
        }
    </tbody>
</table>
}
