
@if (isLoggedIn()) {
	<div class="app-shell">
		<aside class="sidebar">
			<a class="brand" routerLink="/employees">
				<span class="brand-mark">C</span>
				<span i18n>Company<span class="brand-accent">.ops</span></span>
			</a>
			<div class="sidebar-label" i18n>Workspace</div>
			<nav class="main-nav" aria-label="Main navigation" i18n-aria-label>
				<a routerLink="/employees" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span class="nav-icon">01</span><span i18n>Employees</span></a>
				<a routerLink="/departments" routerLinkActive="active"><span class="nav-icon">02</span><span i18n>Departments</span></a>
				<a routerLink="/assets" routerLinkActive="active"><span class="nav-icon">03</span><span i18n>Assets</span></a>
				<a routerLink="/asset-types" routerLinkActive="active"><span class="nav-icon">04</span><span i18n>Asset types</span></a>
				<a routerLink="/reports" routerLinkActive="active"><span class="nav-icon">05</span><span i18n>Reports</span></a>
			</nav>
			<div class="sidebar-footer">
				<div class="status-dot"><span></span><span i18n>System connected</span></div>
				<button type="button" class="logout-button" (click)="logout()"><span i18n>Sign out</span><span>↗</span></button>
			</div>
		</aside>
		<main class="main-content">
			<header class="topbar">
				<div><span class="eyebrow" i18n>Operations console</span><p class="topbar-title" i18n>People, equipment, and activity</p></div>
				<div class="topbar-actions">
					<div i18n class="topbar-date">CONTROL CENTER <span>2026</span></div>
					<button type="button" class="language-toggle" (click)="toggleLanguage()" [attr.aria-label]="isArabic ? 'Switch to English' : 'التبديل إلى العربية'">
						{{ isArabic ? 'English' : 'العربية' }}
					</button>
				</div>
			</header>
			<div class="content-wrap"><router-outlet /></div>
		</main>
	</div>
} @else {
	<header class="login-language-bar">
		<button type="button" class="language-toggle" (click)="toggleLanguage()" [attr.aria-label]="isArabic ? 'Switch to English' : 'التبديل إلى العربية'">
			{{ isArabic ? 'English' : 'العربية' }}
		</button>
	</header>
	<router-outlet />
}
