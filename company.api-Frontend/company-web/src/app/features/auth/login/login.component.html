<form [formRoot]="loginForm">
    <div class="form-group">
        <label for="username">Username</label>
        <input id="username" [formField]="loginForm.username" />
        @if (loginForm.username().invalid()) {
            @for (err of loginForm.username().errors(); track err.kind) {
                <div class="error">{{ err.message }}</div>
            }
        }
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [formField]="loginForm.password" />
        @if (loginForm.password().invalid()) {
            @for (err of loginForm.password().errors(); track err.kind) {
                <div class="error">{{ err.message }}</div>
            }
        }
    </div>
    
    @if (errorMessage()) {
        <div class="error">{{ errorMessage() }}</div>
    }
    
    <button type="submit">Login</button>
</form>
