<form [formRoot]="employeeFingerprintForm">
	<div class="page-header">
		<div>
			<a [routerLink]="['/employees']" i18n>Back to employees</a>
			<h2 i18n>Add fingerprint</h2>
		</div>
	</div>

	<div class="form-group">
		<label for="fingerIndex" i18n>Finger index</label>
		<select id="fingerIndex" [formField]="employeeFingerprintForm.fingerIndex">
			<option value="" i18n>Select a finger</option>
			@for (finger of fingerIndexOptions; track finger) {
				<option [value]="finger">{{ finger }}</option>
			}
		</select>
		@if (employeeFingerprintForm.fingerIndex().invalid()) {
			@for (err of employeeFingerprintForm.fingerIndex().errors(); track err.kind) {
				<div class="error">{{ err.message }}</div>
			}
		}
	</div>

	<div class="form-group">
		<label for="deviceId" i18n>Device ID</label>
		<input id="deviceId" type="text"  [formField]="employeeFingerprintForm.deviceId" />
	</div>

	<div class="form-group">
		<label for="enrolledDate" i18n>Enrolled date</label>
		<input id="enrolledDate" type="date" [formField]="employeeFingerprintForm.enrolledDate" />
	</div>

	<div class="form-group">
		<label for="quality" i18n>Quality</label>
		<input id="quality" type="text"  [formField]="employeeFingerprintForm.quality" />
	</div>

	@if (error()) {
		<p class="error" role="alert">{{ error() }}</p>
	}

	<button type="submit" [disabled]="saving()">
		@if (saving()) {
			<span i18n>Saving...</span>
		} @else {
			<span i18n>Save fingerprint</span>
		}
	</button>
</form>
